# Review of the preconditions of the Adler-32 contracts.
#
# Reviewed on 2026-11-26, for patched zlib 1.4 on x86-64 Linux.
#
# Every clause of the precondition of every contract in proofs/adler32 is
# listed here, with a verdict and a reason.  tools/check_preconditions.py
# reads the contracts from their Rocq source and fails if a clause there is
# not listed here, or a clause here is not there.  It does not judge the
# reasons.  Those are for a reader to judge.
#
# Three questions were asked of each clause:
#
#   1. Is it needed?  Could the code, or the promise made about it, do
#      without the clause?
#   2. Can the caller meet it, and know that it has?
#   3. Does it constrain the content of the data?  No clause may.
#
# The verdicts:
#
#   type     The clause only gives an argument its C type.  Every value of
#            the type meets it.
#   names    The clause only says which value is passed as which argument.
#   nothing  The clause asks nothing of the caller.
#   defined  The clause is a definition, reviewed below under its name.
#   needed   The code cannot do without it.
#   promise  A condition on the promised result, not on the call.  The call
#            is safe without it.
#   limit    Stricter than C requires.  It is there because of a limit of
#            the tools, and the call it excludes is not covered by any
#            claim of this project.
#   ticks    About the counter that only the function with ticks has.  The
#            function as it ships has no counter, and its caller is asked
#            nothing by such a clause.
#
# `caller` says how a caller meets the clause.  `checked_by` names Rocq
# results that state part of the reason and are proven.
#
# No clause constrains the content of the data.  The one clause about
# content, `map Vubyte bs` in `buffer_array`, says that the bytes read are
# initialized, and allows them any values.

directory = "proofs/adler32"
evidence_in = ["spec/format", "spec/api", "proofs/lib"]

# ---------------------------------------------------------------------------
# adler32_z
# ---------------------------------------------------------------------------

[[contract]]
name = "adler32_z_contract"
function = "adler32_z"

[[contract.clause]]
part = "PROP"
text = "0 <= adler <= Int64.max_unsigned"
verdict = "type"
reason = "The range of `unsigned long`, the type of the checksum argument. Any 64-bit value may be passed, whether or not it is a checksum."
checked_by = ["any_ulong"]

[[contract.clause]]
part = "PROP"
text = "0 <= len <= Int64.max_unsigned"
verdict = "type"
reason = "The range of `unsigned long`, which is `z_size_t` on this target."
checked_by = ["any_ulong"]

[[contract.clause]]
part = "PROP"
text = "buffer_ok b len"
verdict = "defined"
definition = "buffer_ok"
reason = "What the caller must ensure about the buffer."

[[contract.clause]]
part = "PARAMS"
text = "Vlong (Int64.repr adler)"
verdict = "names"
reason = "The first argument is the checksum."

[[contract.clause]]
part = "PARAMS"
text = "buffer_ptr b base"
verdict = "defined"
definition = "buffer_ptr"
reason = "The pointer passed as the buffer."

[[contract.clause]]
part = "PARAMS"
text = "Vlong (Int64.repr len)"
verdict = "names"
reason = "The third argument is the length."

[[contract.clause]]
part = "SEP"
text = "buffer_rep b base"
verdict = "defined"
definition = "buffer_rep"
reason = "The memory the caller lends for the call."

