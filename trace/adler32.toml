[[passage]]
id = "zlib.h-adler32"
source = "zlib_h"
where = "adler32"
before = "ZEXTERN uLong ZEXPORT adler32(uLong adler, const Bytef *buf, uInt len); /*"
after = "*/"

  [[passage.sentence]]
  text = "Update a running Adler-32 checksum with the bytes buf[0..len-1] and return the updated checksum."
  sha256 = "61157115b9f5a4daa3ec9223013afd264b2481b531ddb957834184513a66c859"
  status = "definition"
  covered_by = [
    "fvzlib.api.Adler32.adler32_spec",
    "fvzlib.api.Adler32.running_checksum",
    "fvzlib.api.Adler32Facts.adler32_reference_meets_spec",
    "fvzlib.api.Adler32Facts.adler32_spec_deterministic",
    "fvzlib.api.Adler32Facts.adler32_spec_no_bytes",
  ]
  note = "How len relates to the buffer in memory is a Layer 3 matter."

  [[passage.sentence]]
  text = "An Adler-32 value is in the range of a 32-bit unsigned integer."
  sha256 = "09d83f2c136c466d29ceec02a020d2aea10b64e13141db636d511fe3c6dbefbb"
  status = "theorem"
  covered_by = [
    "fvzlib.format.Adler32Facts.adler32_range",
    "fvzlib.api.Adler32Facts.adler32_spec_range",
    "fvzlib.api.Adler32Facts.running_checksum_range",
  ]

  [[passage.sentence]]
  text = "If buf is Z_NULL, this function returns the required initial value for the checksum."
  sha256 = "f6c4145538d4f5283f653947c11cacae7ea91e8778d8e73f2c7dcc5a9e610f1b"
  status = "definition"
  covered_by = [
    "fvzlib.api.Adler32.adler32_spec",
    "fvzlib.api.Adler32Facts.adler32_initial_value",
  ]
  note = "zlib 1.4 does not keep this promise when len is 1. See ledger/F0001-adler32-null-buffer-length-one.md."

  [[passage.sentence]]
  text = "An Adler-32 checksum is almost as reliable as a CRC-32 but can be computed much faster."
  sha256 = "1d1d8f34d9da04e4ef4c443a0ef67e4bf0aa1616c97562708d94834def3d9b18"
  status = "not-covered"
  note = "Informative comparison. No claim of ours depends on it."

  [[passage.sentence]]
  text = "Usage example: uLong adler = adler32(0L, Z_NULL, 0); while (read_buffer(buffer, length) != EOF) { adler = adler32(adler, buffer, length); } if (adler != original_adler) error();"
  sha256 = "89c1ac7f40f3ce6072bf3b93203500b4aae4b3dcd11c7fa5b982b2eccccfb37f"
  status = "theorem"
  covered_by = [
    "fvzlib.api.Adler32Facts.usage_example",
    "fvzlib.api.Adler32Facts.fed_in_order",
  ]

